<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Studio Syncer</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 16px;
        background-color: #f8f9fa;
        color: #212529;
        margin: 0;
        box-sizing: border-box;
      }
      h2 {
        font-size: 16px;
        margin-top: 0;
        margin-bottom: 16px;
        text-align: center;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #0b5ed7;
      }
      .btn-secondary {
        background-color: #6c757d;
      }
      .btn-secondary:hover {
        background-color: #5c636a;
      }
      .btn:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #198754;
        text-align: center;
        min-height: 18px;
        word-break: break-all;
      }
      .error {
        color: #dc3545 !important;
      }
      .workspace-info {
        font-size: 12px;
        color: #6c757d;
        margin-bottom: 12px;
        word-break: break-all;
      }
      .file-list {
        max-height: 450px;
        overflow-y: auto;
        margin-top: 10px;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        background: white;
      }
      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #dee2e6;
        font-size: 13px;
      }
      .file-item:last-child {
        border-bottom: none;
      }
      .file-item span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }
      .sync-btn-small {
        background-color: #198754;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 11px;
      }
      .sync-btn-small:hover {
        background-color: #157347;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      .controls .btn {
        flex: 1;
      }
      
      /* Auto Save Toggle styles */
      .toggle-container {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        font-size: 13px;
        background-color: #f1f3f5;
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid #e9ecef;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
        margin-right: 10px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ced4da;
        transition: .3s;
        border-radius: 18px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: #0d6efd;
      }
      input:checked + .slider:before {
        transform: translateX(14px);
      }
      .toggle-label {
        user-select: none;
        color: #495057;
        font-weight: 500;
      }

      /* Collapsible Tree styles */
      .tree-folder {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        border-bottom: 1px solid #f1f3f5;
        color: #343a40;
      }
      .tree-folder:hover {
        background-color: #f1f3f5;
      }
      .tree-folder-arrow {
        color: #6c757d;
        transition: transform 0.15s ease;
      }
      .tree-folder-children {
        border-left: 1px dashed #dee2e6;
        margin-left: 17px;
        padding-left: 2px;
      }
      .tree-file {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 12px;
        font-size: 13px;
        border-bottom: 1px solid #f1f3f5;
      }
      .tree-file:hover {
        background-color: #f8f9fa;
      }
      .tree-file-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 65%;
        color: #495057;
      }
      .tree-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
        margin-bottom: 4px;
        padding: 0 4px;
      }
      .tree-action-btn {
        background: none;
        border: none;
        color: #0d6efd;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
      }
      .tree-action-btn:hover {
        background-color: #e9ecef;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>Local to Web Studio Syncer</h2>
    
    <div id="workspaceInfo" class="workspace-info">No workspace selected</div>
    
    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" id="autoSaveToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Auto Save changes</span>
    </div>

    <div class="controls">
      <button id="selectWorkspaceBtn" class="btn">Select Local Workspace</button>
      <button id="refreshBtn" class="btn btn-secondary" style="display: none;">Refresh</button>
    </div>
    <button id="syncBtn" class="btn" style="display: none;">Grant Permissions to View Files</button>
    
    <div id="treeActions" class="tree-actions" style="display: none;">
      <button id="expandAllBtn" class="tree-action-btn">Expand All</button>
      <button id="collapseAllBtn" class="tree-action-btn">Collapse All</button>
    </div>
    
    <div id="fileList" class="file-list"></div>
    
    <div id="status"></div>
    
    <script type="module" src="/src/popup.js"></script>
  </body>
</html>
